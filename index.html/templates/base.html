<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ shop_name }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top no-print"><div class="wrap bar">
  <a class="brand" href="{{ url_for('home') }}">✂ {{ shop_name }}</a>
  {% if session.admin %}
  <nav>
    <a href="{{ url_for('dashboard') }}">Orders</a>
    <a href="{{ url_for('prices') }}">Silai Price</a>
    <a href="{{ url_for('qr_page') }}">QR</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  </nav>
  {% endif %}
</div></header>
<main class="wrap">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
